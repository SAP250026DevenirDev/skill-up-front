<div class="p-6">
  <h2 class="text-xl font-bold mb-4">Modifier une catégorie</h2>

  <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">

    <div class="mb-4">
      <label class="block mb-1">Name</label>
      <input
        type="text"
        formControlName="name"
        class="border px-3 py-2 rounded w-full"
        placeholder="Name"
      />
      @if (updateForm.get('name')?.invalid && updateForm.get('name')?.touched) {
        <span class="text-red-500 text-sm">Name is required (3-100 characters)</span>
      }
    </div>

    <div class="mb-4">
      <label class="block mb-1">Description</label>
      <textarea
        formControlName="description"
        class="border px-3 py-2 rounded w-full"
        placeholder="Description"
      ></textarea>
    </div>

    <button
      type="submit"
      class="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-600 transition"
    >
      Submit
    </button>

  </form>
</div>
