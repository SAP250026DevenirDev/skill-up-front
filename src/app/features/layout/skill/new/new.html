<div class="max-w-md mx-auto pl-50 pt-10 rounded-lg">
    <h1 class="text-xl font-bold mb-6 text-gray-800">New Skill</h1>
    <div class="flex flex-col items-center">
        <form [formGroup]="newSkillForm" (ngSubmit)="onSubmitNewSkill()"
                class="
                mx-auto 
                p-6 
                bg-gray-300 
                rounded-lg 
                shadow-md"
        >
            <div class="flex flex-col items-center gap-2 mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Skill name: </label>
                <input type="text" id="name" formControlName="name" 
                    class="
                        w-full 
                        px-3 
                        py-2 
                        border 
                        border-gray-200 
                        bg-white 
                        rounded-md 
                        focus:outline-none 
                        focus:ring-2 
                        focus:ring-blue-500 
                        focus:border-blue-500" 
                />
            </div>
            <div class="flex flex-col items-center gap-2 mb-4">
                <label for="desc" class="block text-sm font-medium text-gray-700 mb-1">Description: </label>
                <textarea name="" id="desc" formControlName="description" 
                    class="
                        w-full 
                        px-3 
                        py-2 
                        border 
                        border-gray-200 
                        bg-white 
                        rounded-md 
                        focus:outline-none 
                        focus:ring-2 
                        focus:ring-blue-500 
                        focus:border-blue-500">
                </textarea>
            </div>
            <div class="flex flex-col items-center gap-2 mb-4">
                // test entrée de donnée
                <input type="text" id="name" formControlName="category" 
                    class="
                        w-full 
                        px-3 
                        py-2 
                        border 
                        border-gray-200 
                        bg-white 
                        rounded-md 
                        focus:outline-none 
                        focus:ring-2 
                        focus:ring-blue-500 
                        focus:border-blue-500" 
                />
                <!-- <select id="category" formControlName="category">
                    <option value="0">Select category</option>
                    <option value="1">Backend</option>
                    <option value="2">Frontend</option>
                    <option value="3">DevOps</option>
                    <option value="4">Security</option>
                    <option value="5">Soft Skills</option>
                </select> -->
            </div>
            <div>
                <button 
                    class="
                        w-full 
                        bg-gray-600 
                        text-white 
                        py-2 
                        px-4 
                        rounded-md 
                        hover:bg-gray-200 
                        hover:text-gray-700 
                        focus:outline-none 
                        focus:ring-2 
                        focus:ring-blue-500 
                        focus:ring-offset-2">
                    Save new skill
                </button>
            </div>
        </form>
    </div>
</div>
