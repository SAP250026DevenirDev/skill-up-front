<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Créer un utilisateur
    </h1>

    <form [formGroup]="registerForm" class="space-y-5" (ngSubmit)="OnSubmit()">
      
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-semibold text-gray-700">Email</label>
        <input
          id="email"
          type="email"
          placeholder="exemple@mail.com"
          formControlName="email"
          class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="firstName" class="text-sm font-semibold text-gray-700">Prénom</label>
          <input
            id="firstName"
            type="text"
            placeholder="Jean"
            formControlName="firstName"
            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="lastName" class="text-sm font-semibold text-gray-700">Nom</label>
          <input
            id="lastName"
            type="text"
            placeholder="Dupont"
            formControlName="lastName"
            class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="role" class="text-sm font-semibold text-gray-700">Rôle</label>
        <select 
          id="role" 
          formControlName="role"
          class="px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all appearance-none cursor-pointer"
        >
          <option value="" disabled selected>Choisir un rôle</option>
          <option value="Collaborator">Collaborateur</option>
          <option value="Manager">Manager</option>
          <option value="Administrator">Administrateur</option>
        </select>
      </div>

      <button 
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-bold py-2.5 rounded-lg transition-colors shadow-md"
      >
        Enregistrer l'utilisateur
      </button>
    </form>
  </div>
</div>
