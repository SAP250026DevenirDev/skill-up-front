<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="email@domain.com" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="text-red-500 text-sm mt-1">Email invalide</p>
        }
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" formControlName="hashedPassword"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••" />
        @if (form.controls.hashedPassword.invalid && form.controls.hashedPassword.touched) {
        <p class="text-red-500 text-sm mt-1">Minimum 4 caractères</p>
        }
      </div>

      @if (errorMessage()) {
      <p class="bg-red-100 text-red-600 text-sm p-3 rounded mb-4">{{ errorMessage() }}</p>
      }

                            <!--Désactive le bouton si le formulaire est invalide ou si une requête est en cours -->
      <button type="submit" [disabled]="form.invalid || isLoading()" class="w-full bg-blue-600 text-white py-2 
      rounded hover:bg-blue-700 transition font-medium disabled:opacity-50 flex items-center justify-center gap-2">
        
      <!--Affichage du spinner seulement si isLoading est true.-->
        @if (isLoading()) {
          <!-- Spinner en svg "http://www.w3.org/2000/svg"-->
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
          Connexion...
        } @else { <!--Si pas de chargement: affiche texte normal -->
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
