<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">New Skill</h1>
        <div class="flex flex-col items-center">
            <form [formGroup]="newSkillForm" (ngSubmit)="onSubmitNewSkill()">
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Skill name: </label>
                    <input type="text" id="name" formControlName="name" 
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div class="mb-6">
                    <label for="desc" class="block text-sm font-medium text-gray-700 mb-1">Description: </label>
                    <textarea name="" id="desc" formControlName="description" 
                        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </textarea>
                </div>
                <div class="mb-4">
                    <select id="category" formControlName="category">
                        <option value="" disabled>Valeur par défaut</option>
                        <option *ngFor="let category of categoryList" [value]="category.id">
                            {{ category.cat }}
                        </option>
                    </select>
                </div>
                <div>
                    <button 
                        class="w-full bg-blue-600 text-white py-2 
      rounded hover:bg-blue-700 transition font-medium disabled:opacity-50 flex items-center justify-center gap-2">
                        Save new skill
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
